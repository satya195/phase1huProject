name: stinger-app
region: nyc
services:
  # Frontend Service
  - name: frontend
    source_dir: /Fontend
    github:
      repo: your-username/your-repo-name
      branch: main
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /
    envs:
      - key: VITE_API_URL
        value: ${backend.PUBLIC_URL}
    build_command: npm run build

  # Backend Service
  - name: backend
    source_dir: /Backend
    github:
      repo: your-username/your-repo-name
      branch: main
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: MONGO_URI
        value: ${stinger-db.DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: AI_SERVICE_URL
        value: ${ai-service.PUBLIC_URL}

  # AI Service
  - name: ai-service
    source_dir: /llamaAi
    github:
      repo: your-username/your-repo-name
      branch: main
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-s
    routes:
      - path: /ai
    health_check:
      http_path: /health
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: stinger-db
    engine: MONGODB
    version: "6"
    size: db-s-1vcpu-1gb
    num_nodes: 1

static_sites:
  - name: stinger-static
    source_dir: /Fontend
    github:
      repo: your-username/your-repo-name
      branch: main
    build_command: npm run build
    output_dir: /dist
    index_document: index.html
    error_document: index.html
    routes:
      - path: /static

domains:
  - domain: stinger.your-domain.com
    type: PRIMARY 